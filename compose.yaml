# Default profile: everything in Docker, CPU inference. Runs anywhere with no
# host setup. See compose.gpu.yaml (NVIDIA) and compose.external.yaml (macOS /
# native Ollama) for the other two paths, and the README for the trade-offs.

name: yunex-demo

x-model-env: &model-env
  MODEL_MAIN: ${MODEL_MAIN:-gemma4:e2b-it-qat}
  MODEL_EMBED: ${MODEL_EMBED:-embeddinggemma-2:270m}

services:
  ollama:
    image: ollama/ollama:0.40.13
    # Deliberately NOT behind a profile: a bare `docker compose up` must bring
    # up a working stack. compose.external.yaml gates this off on its own by
    # adding an inactive profile, so no gate is needed here.
    environment:
      # -1 keeps weights resident, so nothing unloads mid-presentation.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PUBLISHED_PORT:-11434}:11434"
    healthcheck:
      # The image ships no curl; `ollama list` exercises the HTTP API instead.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  model-init:
    image: ollama/ollama:0.40.13
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      <<: *model-env
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./docker/pull-models.sh:/pull-models.sh:ro
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    restart: "no"

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data
    ports:
      # Host port is configurable: 8000 is the most commonly contested port on
      # a dev machine. The in-container port stays 8000, so CHROMA_PORT (what
      # the app connects to over the compose network) is unaffected.
      - "${CHROMA_PUBLISHED_PORT:-8100}:8000"
    healthcheck:
      # /bin/sh is dash here, which has no /dev/tcp -- call bash directly.
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    depends_on:
      chroma:
        condition: service_healthy
    environment:
      <<: *model-env
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-yunex_demo}
    volumes:
      # Live reload during the demo: edit a page, refresh the browser.
      - ./src:/app/src
    ports:
      - "${APP_PUBLISHED_PORT:-8501}:8501"
    healthcheck:
      # No curl in the uv/slim base image, but python is on PATH via the venv.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://localhost:8501/_stcore/health", timeout=5
          ).status == 200 else 1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama_models:
  chroma_data:
